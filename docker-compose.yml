services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - shared_memory_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - shared-memory-internal

  memory-api:
    build:
      context: ./memory-api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - MEMORY_API_KEYS=${MEMORY_API_KEYS}
      - MEMORY_SERVICE_ID=memory-api
      - EMBEDDING_API_URL=${EMBEDDING_API_URL}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shared-memory-internal
      - hermes-net

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    command: >
      sh -c 'while true; do
        pg_dump -h postgres -U ${POSTGRES_USER} -d ${POSTGRES_DB} | gzip > /backups/memory_$(date +%Y%m%d_%H%M%S).sql.gz;
        find /backups -name "memory_*.sql.gz" -mtime +7 -delete;
        echo "backup done: $(ls /backups | wc -l) files, latest $(ls -t /backups | head -1)";
        sleep 86400;
      done'
    volumes:
      - shared_memory_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shared-memory-internal

  # Tailscale serve sidecar - masaüstü (Claude Code) erişimi için.
  # memory-api'yi SADECE tailnet'te yayınlar; public'e port AÇILMAZ.
  # Kanıtlanmış pattern: tailscale-tefas-proxy (dokploy-network'te çalışıyor)
  memory-tailscale:
    image: tailscale/tailscale:latest
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true
      - TS_EXTRA_ARGS=--hostname=memory-serve
    volumes:
      - ts_memory_state:/var/lib/tailscale
    command: >
      sh -c 'tailscaled --tun=userspace-networking &
             sleep 3
             tailscale up --authkey=${TS_AUTHKEY} --hostname=memory-serve
             sleep 2
             tailscale serve --bg --https=443 http://memory-api:8000
             tailscale serve status
             tail -f /dev/null'
    depends_on:
      memory-api:
        condition: service_healthy
    networks:
      - shared-memory-internal

networks:
  shared-memory-internal:
    driver: bridge
  hermes-net:
    external: true
    name: hermesorg-hermesorg-fbbmsb_hermes-isolated

volumes:
  shared_memory_pgdata:
  shared_memory_backups:
  ts_memory_state:
